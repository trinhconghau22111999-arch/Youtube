plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.phone.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.phone.launcher"
        minSdk 24
        targetSdk 34
        // QUAN TRỌNG: versionCode PHẢI tăng dần mỗi lần build, nếu không Android sẽ coi "bản
        // mới" là CÙNG PHIÊN BẢN với bản đang cài và có thể ÂM THẦM KHÔNG CÀI ĐÈ được (khiến
        // APK trông như build xong nhưng cài vào máy vẫn là code cũ). Trước đây bị hardcode
        // cứng "1" ở MỌI lần build -> đây là nguyên nhân rất nhiều lần "sửa xong nhưng cài vào
        // vẫn y như cũ". Giờ tự tính theo thời gian build (giây) để luôn tăng dần thật sự.
        //
        // FIX (versionCode dùng thẳng epoch giây sẽ VỠ khoảng năm 2036): Google Play giới hạn
        // versionCode tối đa 2100000000 - nếu dùng thẳng số giây kể từ 1/1/1970 thì mốc đó rơi
        // vào khoảng giữa năm 2036 (2100000000 giây ~ 66.5 năm sau 1970), sau đó KHÔNG build
        // được nữa. Trừ đi 1 mốc gốc cố định (BASE_EPOCH = 1/1/2025 00:00:00 UTC) để versionCode
        // bắt đầu lại gần 0, dời hạn "vỡ" ra thêm ~66 năm nữa (tới khoảng năm 2091) mà vẫn giữ
        // đúng tính chất tăng dần mỗi giây như cũ.
        def BASE_EPOCH = 1735689600L // 2025-01-01T00:00:00Z
        def buildVersionCode = (((System.currentTimeMillis() / 1000) as Long) - BASE_EPOCH).intValue()
        versionCode buildVersionCode
        versionName "1.0." + buildVersionCode
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // FIX BUILD FAILED (aapt2 linking): commit dọn dependency trước đó lỡ xoá thư viện này vì
    // tưởng không code nào dùng tới - nhưng Theme.AdBlockBrowser (values.xml) lại kế thừa từ
    // Theme.MaterialComponents.DayNight.NoActionBar và ShapeAppearance.WP.Flat kế thừa từ
    // ShapeAppearance.MaterialComponents.SmallComponent, cả 2 đều thuộc thư viện Material
    // Components - thiếu nó khiến aapt2 không link được resource, build luôn FAILED.
    implementation 'com.google.android.material:material:1.12.0'
}
